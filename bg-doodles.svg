<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
  <!-- Falsona background: faint line doodles, tiled. Kept away from the
       tile edges so neighbouring tiles never cut a shape in half. -->
  <g stroke="#8A8FA3">
    <!-- chat bubble with dots -->
    <g transform="translate(30 34) rotate(-8)">
      <path d="M0 4 Q0 0 4 0 H40 Q44 0 44 4 V22 Q44 26 40 26 H16 L7 34 V26 H4 Q0 26 0 22 Z"/>
      <circle cx="13" cy="13" r="1.6"/><circle cx="22" cy="13" r="1.6"/><circle cx="31" cy="13" r="1.6"/>
    </g>
    <!-- robot head -->
    <g transform="translate(214 28) rotate(9)">
      <path d="M14 0 V7 M10 0 H18"/>
      <rect x="0" y="7" width="28" height="22" rx="4"/>
      <circle cx="9" cy="17" r="2.6"/><circle cx="19" cy="17" r="2.6"/>
      <path d="M9 24 H19 M-4 15 H0 M28 15 H32"/>
    </g>
    <!-- person -->
    <g transform="translate(122 118) rotate(-6)">
      <circle cx="14" cy="8" r="8"/>
      <path d="M0 34 C0 24 6 19 14 19 C22 19 28 24 28 34"/>
    </g>
    <!-- terminal prompt -->
    <g transform="translate(290 128) rotate(4)">
      <path d="M0 0 L9 8 L0 16 M14 17 H28"/>
    </g>
    <!-- magnifying glass -->
    <g transform="translate(24 220) rotate(-14)">
      <circle cx="12" cy="12" r="11"/>
      <path d="M20 20 L31 31"/>
    </g>
    <!-- eye -->
    <g transform="translate(218 238) rotate(-4)">
      <path d="M0 10 Q17 -6 34 10 Q17 26 0 10 Z"/>
      <circle cx="17" cy="10" r="4.5"/>
    </g>
    <!-- round speech bubble -->
    <g transform="translate(118 288) rotate(10)">
      <path d="M17 1 C27 1 34 7 34 15 C34 23 27 29 17 29 C14 29 11 28.5 9 27.5 L1 31 L4 24 C1.5 21.5 0 18.5 0 15 C0 7 7 1 17 1 Z"/>
    </g>
    <!-- hexagon (a tier emblem nod) -->
    <g transform="translate(300 300)">
      <path d="M12 0 L23 6.5 V19.5 L12 26 L1 19.5 V6.5 Z"/>
    </g>
  </g>
  <g stroke="#FF4FA3">
    <!-- question marks -->
    <path transform="translate(150 30) rotate(12)" d="M0 7 C0 2 4 0 8 0 C13 0 16 3 16 7 C16 12 9 12 9 18 M9 24 V24.5"/>
    <path transform="translate(300 216) rotate(-10) scale(0.8)" d="M0 7 C0 2 4 0 8 0 C13 0 16 3 16 7 C16 12 9 12 9 18 M9 24 V24.5"/>
    <!-- sparkle -->
    <path transform="translate(60 128)" d="M9 0 Q10 8 18 9 Q10 10 9 18 Q8 10 0 9 Q8 8 9 0 Z"/>
  </g>
  <g stroke="#FFC53D">
    <!-- sparkles and a dot trio -->
    <path transform="translate(208 170) scale(0.8)" d="M9 0 Q10 8 18 9 Q10 10 9 18 Q8 10 0 9 Q8 8 9 0 Z"/>
    <path transform="translate(26 316) scale(0.6)" d="M9 0 Q10 8 18 9 Q10 10 9 18 Q8 10 0 9 Q8 8 9 0 Z"/>
    <g transform="translate(176 222)"><circle cx="0" cy="0" r="1.8"/><circle cx="8" cy="0" r="1.8"/><circle cx="16" cy="0" r="1.8"/></g>
    <path transform="translate(108 52)" d="M0 6 H12 M6 0 V12"/>
  </g>
</svg>
